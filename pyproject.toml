[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-c-queueing"
version = "0.1.0"
description = "M/M/c queueing model for AI task scheduling in cloud data centers — analytical Erlang-C solution plus event-driven discrete-event simulation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Avretheking", email = "114388603+Avretheking@users.noreply.github.com"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
mm-c-queue = "mm_c_queueing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mm_c_queueing*"]
